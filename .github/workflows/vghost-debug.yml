name: VGhost Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find and Extract App ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP=""

          while IFS= read -r -d '' file; do
            ZIP="$file"
            break
          done < <(
            find . -maxdepth 5 -type f \
              \( -iname "*.zip" \) \
              ! -path "./android_project/*" \
              -print0
          )

          if [[ -z "$ZIP" ]]; then
            echo "::error::Android project ZIP faylı tapılmadı."
            exit 1
          fi

          echo "Tapılan ZIP: $ZIP"

          rm -rf android_project
          mkdir -p android_project

          unzip -q "$ZIP" -d android_project

          PROJECT_ROOT=""

          while IFS= read -r -d '' file; do
            PROJECT_ROOT="$(dirname "$file")"
            break
          done < <(
            find android_project -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -print0
          )

          if [[ -z "$PROJECT_ROOT" ]]; then
            echo "::error::ZIP daxilində Android project tapılmadı."
            echo "settings.gradle(.kts) yoxdur."
            exit 1
          fi

          if [[ ! -d "$PROJECT_ROOT/app" ]]; then
            echo "::error::Android app module tapılmadı: $PROJECT_ROOT/app"
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "----------------------------------------"
          echo "PROJECT_ROOT: $PROJECT_ROOT"
          echo "----------------------------------------"

          ls -la "$PROJECT_ROOT"

      - name: Verify Android Project
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -Eeuo pipefail

          test -f "settings.gradle.kts" \
            || test -f "settings.gradle" \
            || {
              echo "::error::settings.gradle(.kts) tapılmadı."
              exit 1
            }

          test -f "app/build.gradle.kts" \
            || test -f "app/build.gradle" \
            || {
              echo "::error::app/build.gradle(.kts) tapılmadı."
              exit 1
            }

          if [[ -f "./gradlew" ]]; then
            chmod +x ./gradlew
            echo "Gradle Wrapper tapıldı."
            ./gradlew --version
          else
            echo "Gradle Wrapper yoxdur."
            echo "Global Gradle istifadə olunacaq."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -Eeuo pipefail

          if [[ -f "./gradlew" ]]; then
            chmod +x ./gradlew

            ./gradlew \
              assembleDebug \
              --stacktrace \
              --no-daemon
          else
            gradle \
              assembleDebug \
              --stacktrace \
              --no-daemon
          fi

      - name: Verify Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -Eeuo pipefail

          APK_COUNT=$(find app/build/outputs/apk/debug \
            -type f -name "*.apk" | wc -l)

          if [[ "$APK_COUNT" -eq 0 ]]; then
            echo "::error::Debug APK yaradılmadı."
            exit 1
          fi

          echo "Debug APK:"
          find app/build/outputs/apk/debug \
            -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VGhost-Debug-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
