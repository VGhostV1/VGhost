name: VGhost Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. CHECKOUT
      - name: Checkout
        uses: actions/checkout@v4

      # 2. JAVA 17
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. ANDROID SDK BASE
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # 4. PREPARE ANDROID SDK
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tapılmadı."
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"

          "$SDKMANAGER" --version

          echo ""
          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo ""
          echo "Updating Android SDK metadata..."

          "$SDKMANAGER" --update || true

          echo ""
          echo "Installed SDK packages:"

          "$SDKMANAGER" --list_installed || true

      # 5. INSTALL ANDROID API 37
      - name: Install Android API 37
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(command -v sdkmanager)"

          echo "=========================================="
          echo "SEARCHING ANDROID API 37"
          echo "=========================================="

          "$SDKMANAGER" --list > /tmp/sdk-list.txt

          echo ""
          echo "Available Android 37 packages:"

          grep -E \
            'platforms;android-37|build-tools;37' \
            /tmp/sdk-list.txt || true

          PLATFORM_VERSION="$(
            grep -E \
              '^[[:space:]]*platforms;android-37\.[0-9]+[[:space:]]' \
              /tmp/sdk-list.txt |
            sed 's/^[[:space:]]*//' |
            awk '{print $1}' |
            grep -E '^platforms;android-37\.[0-9]+$' |
            sort -V |
            tail -1
          )"

          if [ -z "$PLATFORM_VERSION" ]; then
            echo ""
            echo "Android 37 platform paketi tapılmadı."
            echo ""
            grep -E 'platforms;android-37' /tmp/sdk-list.txt || true
            exit 1
          fi

          echo ""
          echo "Selected Android Platform:"
          echo "$PLATFORM_VERSION"

          "$SDKMANAGER" --install "$PLATFORM_VERSION"

          BUILD_TOOLS_VERSION="$(
            grep -E \
              '^[[:space:]]*build-tools;37\.[0-9]+\.[0-9]+[[:space:]]' \
              /tmp/sdk-list.txt |
            sed 's/^[[:space:]]*//' |
            awk '{print $1}' |
            grep -E '^build-tools;37\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -1
          )"

          if [ -z "$BUILD_TOOLS_VERSION" ]; then
            echo ""
            echo "Build Tools 37.x tapılmadı."
            echo ""
            grep -E 'build-tools;' /tmp/sdk-list.txt | head -50 || true
            exit 1
          fi

          echo ""
          echo "Selected Build Tools:"
          echo "$BUILD_TOOLS_VERSION"

          "$SDKMANAGER" --install "$BUILD_TOOLS_VERSION"

      # 6. VERIFY ANDROID SDK
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK VERIFICATION"
          echo "=========================================="

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Installed Platforms:"
          ls -la "$ANDROID_HOME/platforms"

          echo ""
          echo "Installed Build Tools:"
          ls -la "$ANDROID_HOME/build-tools"

          echo ""
          echo "Checking Android API 37..."

          PLATFORM_DIR="$(
            find "$ANDROID_HOME/platforms" \
              -maxdepth 1 \
              -type d \
              -name 'android-37.*' \
              ! -name '*beta*' |
            sort -V |
            tail -1
          )"

          if [ -z "$PLATFORM_DIR" ]; then
            echo ""
            echo "Android API 37 quraşdırılmayıb."
            exit 1
          fi

          echo ""
          echo "Android API 37:"
          echo "$PLATFORM_DIR"

          echo ""
          echo "Checking Build Tools 37..."

          BUILD_TOOLS_DIR="$(
            find "$ANDROID_HOME/build-tools" \
              -maxdepth 1 \
              -type d \
              -name '37.*' |
            sort -V |
            tail -1
          )"

          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo ""
            echo "Build Tools 37 quraşdırılmayıb."
            exit 1
          fi

          echo ""
          echo "Build Tools:"
          echo "$BUILD_TOOLS_DIR"

          echo ""
          echo "=========================================="
          echo "ANDROID SDK 37 OK"
          echo "=========================================="

      # 7. FIND APP ZIP
      - name: Find and Extract App ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR APP ZIP"
          echo "=========================================="

          ZIP="$(
            find . \
              -type f \
              -iname '*.zip' \
              ! -path './android_project/*' \
              ! -path './.git/*' \
              -print |
            head -1
          )"

          if [ -z "$ZIP" ]; then
            echo ""
            echo "App ZIP tapılmadı."
            exit 1
          fi

          echo ""
          echo "App ZIP:"
          echo "$ZIP"

          rm -rf android_project

          mkdir -p android_project

          echo ""
          echo "Extracting App ZIP..."

          unzip -q "$ZIP" -d android_project

          echo ""
          echo "Searching Android project..."

          PROJECT_ROOT="$(
            find android_project \
              -type f \
              \( \
                -name 'settings.gradle.kts' \
                -o \
                -name 'settings.gradle' \
              \) \
              -print |
            head -1 |
            xargs -r dirname
          )"

          if [ -z "$PROJECT_ROOT" ]; then
            echo ""
            echo "Android project ZIP daxilində tapılmadı."
            echo ""
            find android_project -maxdepth 4 -type f | head -150
            exit 1
          fi

          echo ""
          echo "PROJECT_ROOT:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      # 8. FORCE AGP 9.3.0
      - name: Force AGP 9.3.0
        shell: bash
        run: |
          set -e

          ROOT_GRADLE="$PROJECT_ROOT/build.gradle.kts"

          if [ ! -f "$ROOT_GRADLE" ]; then
            echo "Root build.gradle.kts tapılmadı."
            exit 1
          fi

          echo "=========================================="
          echo "FORCING ANDROID GRADLE PLUGIN 9.3.0"
          echo "=========================================="

          sed -i \
            's/id("com\.android\.application") version "[^"]*" apply false/id("com.android.application") version "9.3.0" apply false/' \
            "$ROOT_GRADLE"

          echo ""
          echo "=== UPDATED ROOT build.gradle.kts ==="

          cat "$ROOT_GRADLE"

          if ! grep -q \
            'com.android.application.*version "9.3.0"' \
            "$ROOT_GRADLE"; then

            echo ""
            echo "ERROR: AGP 9.3.0 tətbiq olunmadı."
            exit 1
          fi

          echo ""
          echo "AGP 9.3.0 OK"

      # 9. VERIFY PROJECT
      - name: Verify Project Configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PROJECT CONFIGURATION"
          echo "=========================================="

          APP_GRADLE="$PROJECT_ROOT/app/build.gradle.kts"
          ROOT_GRADLE="$PROJECT_ROOT/build.gradle.kts"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "app/build.gradle.kts tapılmadı."
            exit 1
          fi

          if [ ! -f "$ROOT_GRADLE" ]; then
            echo "root build.gradle.kts tapılmadı."
            exit 1
          fi

          echo ""
          echo "=== ROOT build.gradle.kts ==="
          cat "$ROOT_GRADLE"

          echo ""
          echo "=== APP build.gradle.kts ==="
          cat "$APP_GRADLE"

          echo ""
          echo "=== SETTINGS ==="

          if [ -f "$PROJECT_ROOT/settings.gradle.kts" ]; then
            cat "$PROJECT_ROOT/settings.gradle.kts"
          else
            cat "$PROJECT_ROOT/settings.gradle"
          fi

          echo ""
          echo "=========================================="
          echo "SDK CONFIGURATION CHECK"
          echo "=========================================="

          if ! grep -q \
            'compileSdk = 37' \
            "$APP_GRADLE"; then

            echo "compileSdk = 37 tapılmadı."
            exit 1
          fi

          if ! grep -q \
            'targetSdk = 37' \
            "$APP_GRADLE"; then

            echo "targetSdk = 37 tapılmadı."
            exit 1
          fi

          echo ""
          echo "compileSdk = 37 OK"
          echo "targetSdk = 37 OK"

          echo ""
          echo "=========================================="
          echo "AGP VERSION CHECK"
          echo "=========================================="

          if ! grep -q \
            'com.android.application.*version "9.3.0"' \
            "$ROOT_GRADLE"; then

            echo ""
            echo "ERROR: Android Gradle Plugin 9.3.0 tapılmadı."
            exit 1
          fi

          echo ""
          echo "AGP 9.3.0 OK"

      # 10. GRADLE 9.5.0
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-disabled: true

      # 11. CHECK GRADLE
      - name: Check Gradle
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e

          echo "=========================================="
          echo "GRADLE VERSION"
          echo "=========================================="

          gradle --version

      # 12. DECODE KEYSTORE
      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          KEYSTORE_FILE="$RUNNER_TEMP/vghost-release.jks"

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret yoxdur."
            exit 1
          fi

          echo "Decoding signing keystore..."

          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "Keystore boşdur və ya decode alınmadı."
            exit 1
          fi

          echo "Keystore hazırdır."

          echo "VGHOST_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      # 13. CONFIGURE RELEASE SIGNING
      - name: Configure Release Signing
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_ROOT/app/build.gradle.kts"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "app/build.gradle.kts tapılmadı."
            exit 1
          fi

          cat >> "$APP_GRADLE" <<'KOTLIN'

          /*
           * VGhost GitHub Actions Release Signing
           */

          android {

              signingConfigs {

                  create("vghostRelease") {

                      storeFile =
                          file(System.getenv("VGHOST_KEYSTORE_FILE"))

                      storePassword =
                          System.getenv("VGHOST_KEYSTORE_PASSWORD")

                      keyAlias =
                          System.getenv("VGHOST_KEY_ALIAS")

                      keyPassword =
                          System.getenv("VGHOST_KEY_PASSWORD")
                  }
              }

              buildTypes {

                  getByName("release") {

                      signingConfig =
                          signingConfigs.getByName("vghostRelease")
                  }
              }
          }

          KOTLIN

          echo "Release signing configuration hazırdır."

      # 14. BUILD SIGNED APK + AAB
      - name: Build Signed APK + AAB
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          VGHOST_KEYSTORE_FILE: ${{ env.VGHOST_KEYSTORE_FILE }}
          VGHOST_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VGHOST_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VGHOST_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$VGHOST_KEYSTORE_FILE" ]; then
            echo "Keystore file yolu yoxdur."
            exit 1
          fi

          if [ ! -s "$VGHOST_KEYSTORE_FILE" ]; then
            echo "Keystore faylı tapılmadı."
            exit 1
          fi

          if [ -z "$VGHOST_KEYSTORE_PASSWORD" ]; then
            echo "KEYSTORE_PASSWORD secret yoxdur."
            exit 1
          fi

          if [ -z "$VGHOST_KEY_ALIAS" ]; then
            echo "KEY_ALIAS secret yoxdur."
            exit 1
          fi

          if [ -z "$VGHOST_KEY_PASSWORD" ]; then
            echo "KEY_PASSWORD secret yoxdur."
            exit 1
          fi

          echo "=========================================="
          echo "BUILDING RELEASE"
          echo "=========================================="

          gradle \
            bundleRelease \
            assembleRelease \
            --stacktrace \
            --no-daemon

      # 15. VERIFY APK + AAB
      - name: Verify APK + AAB
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e

          echo "=========================================="
          echo "BUILD OUTPUT VERIFICATION"
          echo "=========================================="

          APK_DIR="app/build/outputs/apk/release"
          AAB_DIR="app/build/outputs/bundle/release"

          echo ""
          echo "=== APK ==="

          find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print \
            -exec ls -lh {} \;

          echo ""
          echo "=== AAB ==="

          find "$AAB_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.aab' \
            -print \
            -exec ls -lh {} \;

          APK_COUNT="$(
            find "$APK_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.apk' |
            wc -l
          )"

          AAB_COUNT="$(
            find "$AAB_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.aab' |
            wc -l
          )"

          if [ "$APK_COUNT" -lt 1 ]; then
            echo ""
            echo "APK yaradılmadı."
            exit 1
          fi

          if [ "$AAB_COUNT" -lt 1 ]; then
            echo ""
            echo "AAB yaradılmadı."
            exit 1
          fi

          echo ""
          echo "APK yaradıldı: $APK_COUNT"
          echo "AAB yaradıldı: $AAB_COUNT"

          echo ""
          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

      # 16. UPLOAD AAB
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: VGhost-PlayConsole-AAB
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # 17. UPLOAD APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VGhost-Release-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error