name: VGhost Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools


      # ============================================================
      # 4. PREPARE SDK MANAGER
      # ============================================================
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tapılmadı."
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version

          echo "=== Accepting licenses ==="

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo "=== Updating SDK metadata ==="

          "$SDKMANAGER" --update || true

          echo "=== Installed packages ==="

          "$SDKMANAGER" --list_installed || true


      # ============================================================
      # 5. FIND AND INSTALL ANDROID API 37
      # ============================================================
      - name: Install Android API 37
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(command -v sdkmanager)"

          echo "=========================================="
          echo "SEARCHING ANDROID API 37"
          echo "=========================================="

          "$SDKMANAGER" --list > /tmp/sdk-list.txt

          echo ""
          echo "=== Available Android 37 packages ==="

          grep -E \
            'platforms;android-37|build-tools;37' \
            /tmp/sdk-list.txt || true


          # --------------------------------------------------------
          # Find latest stable Android 37 platform
          # Example:
          # platforms;android-37.0
          # platforms;android-37.1
          # platforms;android-37.2
          # --------------------------------------------------------

          PLATFORM_VERSION="$(
            grep -E \
              '^[[:space:]]*platforms;android-37\.[0-9]+[[:space:]]' \
              /tmp/sdk-list.txt |
            sed 's/^[[:space:]]*//' |
            awk '{print $1}' |
            grep -E '^platforms;android-37\.[0-9]+$' |
            sort -V |
            tail -1
          )"


          if [ -z "$PLATFORM_VERSION" ]; then
            echo ""
            echo "Android 37 platform paketi tapılmadı."
            echo ""
            echo "Mövcud Android 37 paketləri:"
            grep -E 'platforms;android-37' /tmp/sdk-list.txt || true
            exit 1
          fi


          echo ""
          echo "Seçilən Android Platform:"
          echo "$PLATFORM_VERSION"


          # --------------------------------------------------------
          # Install Android platform
          # --------------------------------------------------------

          "$SDKMANAGER" --install \
            "platform-tools" \
            "$PLATFORM_VERSION"


          # --------------------------------------------------------
          # Find latest stable Build Tools 37
          # --------------------------------------------------------

          BUILD_TOOLS_VERSION="$(
            grep -E \
              '^[[:space:]]*build-tools;37\.[0-9]+\.[0-9]+[[:space:]]' \
              /tmp/sdk-list.txt |
            sed 's/^[[:space:]]*//' |
            awk '{print $1}' |
            grep -E '^build-tools;37\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -1
          )"


          if [ -z "$BUILD_TOOLS_VERSION" ]; then
            echo ""
            echo "Build Tools 37.x tapılmadı."
            echo ""
            echo "Mövcud Build Tools:"
            grep -E 'build-tools;' /tmp/sdk-list.txt | head -50 || true
            exit 1
          fi


          echo ""
          echo "Seçilən Build Tools:"
          echo "$BUILD_TOOLS_VERSION"


          # --------------------------------------------------------
          # Install Build Tools
          # --------------------------------------------------------

          "$SDKMANAGER" --install \
            "$BUILD_TOOLS_VERSION"


      # ============================================================
      # 6. VERIFY ANDROID SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK VERIFICATION"
          echo "=========================================="

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Installed Platforms:"
          ls -la "$ANDROID_HOME/platforms" || true

          echo ""
          echo "Installed Build Tools:"
          ls -la "$ANDROID_HOME/build-tools" || true


          # Find installed Android 37 platform

          PLATFORM_DIR="$(
            find "$ANDROID_HOME/platforms" \
              -maxdepth 1 \
              -type d \
              -name 'android-37.*' |
            sort -V |
            tail -1
          )


          if [ -z "$PLATFORM_DIR" ]; then
            echo ""
            echo "Android API 37 quraşdırılmayıb."
            exit 1
          fi


          echo ""
          echo "Android API 37:"
          echo "$PLATFORM_DIR"


          # Find installed Build Tools 37

          BUILD_TOOLS_DIR="$(
            find "$ANDROID_HOME/build-tools" \
              -maxdepth 1 \
              -type d \
              -name '37.*' |
            sort -V |
            tail -1
          )


          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo ""
            echo "Build Tools 37 quraşdırılmayıb."
            exit 1
          fi


          echo ""
          echo "Build Tools:"
          echo "$BUILD_TOOLS_DIR"

          echo ""
          echo "=========================================="
          echo "ANDROID SDK 37 OK"
          echo "=========================================="


      # ============================================================
      # 7. FIND APP ZIP
      # ============================================================
      - name: Find and Extract App ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR APP ZIP"
          echo "=========================================="


          ZIP="$(
            find . \
              -type f \
              -iname '*.zip' \
              ! -path './android_project/*' \
              ! -path './.git/*' \
              -print |
            head -1
          )


          if [ -z "$ZIP" ]; then
            echo ""
            echo "App ZIP tapılmadı."
            exit 1
          fi


          echo ""
          echo "Tapılan App ZIP:"
          echo "$ZIP"


          rm -rf android_project

          mkdir -p android_project


          echo ""
          echo "Extracting..."

          unzip -q "$ZIP" -d android_project


          echo ""
          echo "Searching Android project..."


          PROJECT_ROOT="$(
            find android_project \
              -type f \
              \( \
                -name 'settings.gradle.kts' \
                -o \
                -name 'settings.gradle' \
              \) \
              -print |
            head -1 |
            xargs -r dirname
          )


          if [ -z "$PROJECT_ROOT" ]; then
            echo ""
            echo "Android project ZIP daxilində tapılmadı."
            echo ""
            echo "ZIP contents:"
            find android_project -maxdepth 4 -type f | head -150
            exit 1
          fi


          echo ""
          echo "PROJECT_ROOT:"
          echo "$PROJECT_ROOT"


          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"


      # ============================================================
      # 8. VERIFY PROJECT CONFIGURATION
      # ============================================================
      - name: Verify Project Configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PROJECT CONFIGURATION"
          echo "=========================================="


          if [ ! -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            echo "app/build.gradle.kts tapılmadı."
            exit 1
          fi


          echo ""
          echo "=== ROOT build.gradle.kts ==="

          cat "$PROJECT_ROOT/build.gradle.kts"


          echo ""
          echo "=== APP build.gradle.kts ==="

          cat "$PROJECT_ROOT/app/build.gradle.kts"


          echo ""
          echo "=== SETTINGS ==="

          if [ -f "$PROJECT_ROOT/settings.gradle.kts" ]; then
            cat "$PROJECT_ROOT/settings.gradle.kts"
          else
            cat "$PROJECT_ROOT/settings.gradle"
          fi


          echo ""
          echo "=========================================="
          echo "SDK CONFIGURATION CHECK"
          echo "=========================================="


          grep -q \
            'compileSdk = 37' \
            "$PROJECT_ROOT/app/build.gradle.kts"


          grep -q \
            'targetSdk = 37' \
            "$PROJECT_ROOT/app/build.gradle.kts"


          echo ""
          echo "compileSdk = 37 OK"
          echo "targetSdk = 37 OK"


      # ============================================================
      # 9. GRADLE 9.3.1
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true


      # ============================================================
      # 10. CHECK GRADLE
      # ============================================================
      - name: Check Gradle
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e

          echo "=========================================="
          echo "GRADLE VERSION"
          echo "=========================================="

          gradle --version


      # ============================================================
      # 11. DECODE KEYSTORE
      # ============================================================
      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret yoxdur."
            exit 1
          fi


          echo "$KEYSTORE_BASE64" |
            base64 --decode >
            "$RUNNER_TEMP/vghost-release.jks"


          if [ ! -s "$RUNNER_TEMP/vghost-release.jks" ]; then
            echo "Keystore boşdur və ya decode alınmadı."
            exit 1
          fi


          echo "Keystore hazırdır."


      # ============================================================
      # 12. CONFIGURE RELEASE SIGNING
      # ============================================================
      - name: Configure Release Signing
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_ROOT/app/build.gradle.kts"


          if [ ! -f "$APP_GRADLE" ]; then
            echo "app/build.gradle.kts tapılmadı."
            exit 1
          fi


          cat >> "$APP_GRADLE" <<'KOTLIN'

          /*
           * VGhost GitHub Actions Release Signing
           */

          android {

              signingConfigs {

                  create("vghostRelease") {

                      storeFile =
                          file(System.getenv("VGHOST_KEYSTORE_FILE"))

                      storePassword =
                          System.getenv("VGHOST_KEYSTORE_PASSWORD")

                      keyAlias =
                          System.getenv("VGHOST_KEY_ALIAS")

                      keyPassword =
                          System.getenv("VGHOST_KEY_PASSWORD")
                  }
              }

              buildTypes {

                  getByName("release") {

                      signingConfig =
                          signingConfigs.getByName("vghostRelease")
                  }
              }
          }

          KOTLIN


          echo "Release signing configuration hazırdır."


      # ============================================================
      # 13. BUILD SIGNED APK + AAB
      # ============================================================
      - name: Build Signed APK + AAB
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          VGHOST_KEYSTORE_FILE: ${{ runner.temp }}/vghost-release.jks
          VGHOST_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VGHOST_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VGHOST_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$VGHOST_KEYSTORE_PASSWORD" ]; then
            echo "KEYSTORE_PASSWORD secret yoxdur."
            exit 1
          fi


          if [ -z "$VGHOST_KEY_ALIAS" ]; then
            echo "KEY_ALIAS secret yoxdur."
            exit 1
          fi


          if [ -z "$VGHOST_KEY_PASSWORD" ]; then
            echo "KEY_PASSWORD secret yoxdur."
            exit 1
          fi


          echo "=========================================="
          echo "BUILDING RELEASE"
          echo "=========================================="


          gradle \
            bundleRelease \
            assembleRelease \
            --stacktrace \
            --no-daemon


      # ============================================================
      # 14. VERIFY APK + AAB
      # ============================================================
      - name: Verify APK + AAB
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e

          echo "=========================================="
          echo "BUILD OUTPUT VERIFICATION"
          echo "=========================================="


          APK_DIR="app/build/outputs/apk/release"
          AAB_DIR="app/build/outputs/bundle/release"


          echo ""
          echo "=== APK ==="

          find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print \
            -exec ls -lh {} \;


          echo ""
          echo "=== AAB ==="

          find "$AAB_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.aab' \
            -print \
            -exec ls -lh {} \;


          APK_COUNT="$(
            find "$APK_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.apk' |
            wc -l
          )"


          AAB_COUNT="$(
            find "$AAB_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.aab' |
            wc -l
          )"


          if [ "$APK_COUNT" -lt 1 ]; then
            echo ""
            echo "APK yaradılmadı."
            exit 1
          fi


          if [ "$AAB_COUNT" -lt 1 ]; then
            echo ""
            echo "AAB yaradılmadı."
            exit 1
          fi


          echo ""
          echo "APK yaradıldı: $APK_COUNT"
          echo "AAB yaradıldı: $AAB_COUNT"


          echo ""
          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="


      # ============================================================
      # 15. UPLOAD AAB
      # ============================================================
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: VGhost-PlayConsole-AAB
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error


      # ============================================================
      # 16. UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VGhost-Release-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error